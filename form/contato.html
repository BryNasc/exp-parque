<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulário de Contato</title>
</head>
<body>
    <section>
        <h2>Contato</h2>
        <form action="obrigado.html" method="get">
            <label for="name">Nome</label>
            <input type="text" id="name" name="name" placeholder="Digite seu nome" autocomplete="name" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>

            <label for="message">Mensagem</label>
            <textarea id="message" name="message" rows="10" placeholder="Digite sua mensagem" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </section>
</body>
</html>
